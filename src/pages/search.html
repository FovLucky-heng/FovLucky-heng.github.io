<div class="wrap section">
  <div class="section-head">
    <span class="eyebrow">搜索</span>
    <h1 class="h-section">找点什么</h1>
    <p class="sub-section">{{count}} 篇内容，输入关键词即可。标题、摘要、标签都会被匹配。</p>
  </div>

  <div class="search-box">
    <svg class="search-box__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="input search-box__input" id="searchInput" type="search" placeholder="试试：外卖、拉伸、预算、焦虑" autocomplete="off" aria-label="搜索内容" />
  </div>

  <p class="hint mt-16" id="searchHint">输入两个字以上开始搜索。</p>

  <div class="search-suggest">
    <span class="search-suggest__label">试试这些</span>
    <button class="tag-chip" type="button" data-q="外卖">外卖</button>
    <button class="tag-chip" type="button" data-q="拉伸">拉伸</button>
    <button class="tag-chip" type="button" data-q="预算">预算</button>
    <button class="tag-chip" type="button" data-q="焦虑">焦虑</button>
    <button class="tag-chip" type="button" data-q="早餐">早餐</button>
    <button class="tag-chip" type="button" data-q="穿搭">穿搭</button>
  </div>
  <div class="grid-3 mt-24" id="searchResults"></div>
</div>
